[package]
name = "atlas"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
description = "Call of Duty asset tool: open fastfiles, export models and maps to Cast for Blender, edit zones"

[build-dependencies]
winresource = "0.1"

[dependencies]
aes = "0.9.4"
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
dirs = "7.0.0"
encoding_rs = "0.8"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11", "accesskit"] }
flate2 = "1.1.11"
glam = "0.34.3"
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "tga", "tiff"] }
pollster = "1.0.3"
rfd = "0.18.0"
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
sha2 = "0.11.1"
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "dds"] }
