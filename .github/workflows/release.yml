name: release

# Pushing a tag like v0.1.0 builds the Windows program and attaches it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add i686-pc-windows-msvc

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/ifs_helper

      - name: Tests (no game data needed)
        run: cargo test --release

      - name: Build atlas
        run: cargo build --release

      - name: Build the 3.19 .ifs helper
        working-directory: tools/ifs_helper
        run: cargo build --release --target i686-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $name = "atlas-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/atlas.exe $name/
          Copy-Item tools/ifs_helper/target/i686-pc-windows-msvc/release/ifs-helper.exe $name/
          Copy-Item README.md, LICENSE, ATTRIBUTION.md $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "atlas-${{ github.ref_name }}-windows-x64"
          gh release create "${{ github.ref_name }}" "$name.zip" "$name.zip.sha256" --title "atlas ${{ github.ref_name }}" --generate-notes
